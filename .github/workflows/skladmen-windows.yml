# SkladMen — Windows installer build.
#
# Additive workflow (does not touch upstream main.yml, so security updates from
# upstream rebase cleanly). Builds ONLY the Windows target via KDE Craft and
# uploads the branded NSIS .exe installer as an artifact.
#
# Why a separate workflow instead of the upstream one:
#   * upstream main.yml runs a 3-platform matrix with `fail-fast: true`, so a
#     macOS/Linux leg failing on a fork (missing signing secrets) cancels the
#     Windows leg mid-build.
#   * its Windows leg takes the SonarCloud path on non-PR events, which needs a
#     SONAR_TOKEN secret a fork does not have.
# This workflow sidesteps both: Windows only, no Sonar, no signing.
#
# The `--set srcDir=...` step is what makes Craft build THIS checkout (with the
# branding/ overlay) instead of fetching vanilla owncloud/client.

name: SkladMen Windows

on:
  push:
    branches:
      - skladmen-branding
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      CRAFT_TARGET: windows-cl-msvc2022-x86_64
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The craft packaging blueprint reads the executable / shortname from the
      # environment (not from our CMake branding), falling back to "owncloud".
      # Set them so the packager's exe name, shortcut target and executable
      # filter line up with the branded build (skladmen.exe).
      APPLICATION_EXECUTABLE: skladmen
      APPLICATION_SHORTNAME: SkladMen
      # Installer publisher (legal entity). Base64 (UTF-8) so no Cyrillic lands in
      # the YAML/PowerShell source — decoded in the blueprint-rebrand step.
      # Uses guillemets «» (proper RU typography) instead of ASCII quotes, which
      # would break the generated NSIS `!define`. Decodes to: ООО «Бинарность»
      SKLADMEN_COMPANY_B64: 0J7QntCeIMKr0JHQuNC90LDRgNC90L7RgdGC0YzCuw==

    steps:
      - name: Check out source (with branding overlay)
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: ~/cache
          key: ${{ runner.os }}-${{ env.CRAFT_TARGET }}

      - name: Clone CraftMaster
        run: git clone --depth=1 https://invent.kde.org/kde/craftmaster.git "$env:HOME/craft/CraftMaster/CraftMaster"

      - name: Craft setup
        run: |
          New-Item -Path ~/cache -ItemType Directory -ErrorAction SilentlyContinue
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" --setup

      - name: Craft unshelve (pin dependency versions)
        run: |
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --unshelve "${env:GITHUB_WORKSPACE}/.craft.shelf"

      - name: Rebrand craft blueprint (installer chrome)
        # The craft packaging blueprint (craft-blueprints-owncloud) hard-codes the
        # product display name, description and publisher used for the NSIS
        # installer title, Start-menu shortcut, install folder and Add/Remove-
        # Programs entry. There is no env/CMake hook for these, so patch the
        # blueprint file in place after Craft has cloned it (before packaging).
        run: |
          $company = [System.Text.Encoding]::UTF8.GetString([Convert]::FromBase64String($env:SKLADMEN_COMPANY_B64))
          # Python single-quoted literal so the inner double-quotes survive.
          $pyCompany = 'self.defines["company"] = ' + "'" + $company + "'"
          $files = Get-ChildItem -Path "$env:HOME/craft" -Recurse -Filter owncloud-client.py -ErrorAction SilentlyContinue
          if (-not $files) { Write-Error "blueprint owncloud-client.py not found under $env:HOME/craft"; exit 1 }
          foreach ($f in $files) {
            $c = Get-Content $f.FullName -Raw
            $c = $c.Replace('self.description = "ownCloud Desktop Client"', 'self.description = "SkladMen Desktop Client"')
            $c = $c.Replace('self.displayName = "ownCloud"', 'self.displayName = "SkladMen"')
            $c = $c.Replace('self.webpage = "https://github.com/owncloud/client"', 'self.webpage = "https://skladmen.ru"')
            $c = $c.Replace('self.defines["company"] = "ownCloud GmbH"', $pyCompany)
            Set-Content -NoNewline -Encoding utf8 $f.FullName $c
            Write-Host "patched blueprint: $($f.FullName) (company=$company)"
          }
          # fail loudly if any visible ownCloud string survived the patch
          $left = Select-String -Path $files.FullName -Pattern 'displayName = "ownCloud"','"ownCloud GmbH"','"ownCloud Desktop Client"'
          if ($left) { $left; Write-Error "ownCloud strings still present in blueprint"; exit 1 }

      - name: Prepare
        run: |
          New-Item -ItemType Directory "${env:GITHUB_WORKSPACE}/binaries/"
          # Build from this checkout so the branding/ overlay is picked up.
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set srcDir="${env:GITHUB_WORKSPACE}" owncloud/owncloud-client
          # Compile the in-app auto-updater (-DWITH_AUTO_UPDATER=ON via the blueprint).
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set enableAutoUpdater=true owncloud/owncloud-client
          # Monotonic build number -> version 6.0.3.<run> so the update feed can
          # compare newer/older and avoid re-updating to the same build.
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --set buildNumber=${env:GITHUB_RUN_NUMBER} owncloud/owncloud-client
          # NSIS, used to produce the installer.
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c dev-utils/nsis

      - name: Install dependencies
        run: |
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --install-deps owncloud/owncloud-client

      - name: Build
        run: |
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache owncloud/owncloud-client

      - name: Package (NSIS installer)
        run: |
          & "${env:GITHUB_WORKSPACE}/.github/workflows/.craft.ps1" -c --no-cache --package owncloud/owncloud-client

      - name: Collect installer
        run: |
          Copy-Item "$env:HOME/craft/binaries/*" "${env:GITHUB_WORKSPACE}/binaries/" -ErrorAction SilentlyContinue
          Get-ChildItem "${env:GITHUB_WORKSPACE}/binaries/"

      - name: Upload installer artifact
        uses: actions/upload-artifact@v7
        with:
          name: SkladMen-windows-installer
          path: ${{ github.workspace }}/binaries/*
